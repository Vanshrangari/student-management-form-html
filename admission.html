        <h1>Admission Form</h1>
    </header>
    <main>
        <ul>
         <form action="">
        <li><div>
            <label for="student-full-name">Student Full Name</label>
            <input id="student-full-name" type="text" placeholder="Enter name">
        </div></li><br>
         <li><div>
            <label for="Father-full-name">Father's Full Name</label>
            <input id="Father-full-name" type="text" placeholder="Enter name">
        </div></li><br>
         <li><div>
            <label for="Mother-full-name">Mother's Full Name</label>
            <input id="Mother-full-name" type="text" placeholder="Enter name">
        </div></li><br>
        <div><li>
        <label for="student-email">Student Email</label>
            <input id="student-email" type="email" placeholder="enter email">
        </div></li><br>
        <li><div>
            <label for="phone">phone</label>
            <input id="phone" type="phone" placeholder="enter phone">
        </div></li><br>
        <li><div>
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date">
        </div></li><br>
        <li><div>
            <label for="age">Age</label>
            <input id="age" type="number" placeholder="enter age">
        </div></li><br> <div class="form-group">
  <li><label class="form-label">Gender</label></li>
  <div class="radio-group">
    
    <label class="radio-label">
      <input type="radio" name="gender" value="male" required>
      <span class="custom-radio"></span> Male
    </label>

    <label class="radio-label">
      <input type="radio" name="gender" value="female">
      <span class="custom-radio"></span> Female
    </label>

    <label class="radio-label">
      <input type="radio" name="gender" value="other">
      <span class="custom-radio"></span> Other
    </label>

  </div>
</div><br>
         <li><div>
            <label for="father's occupation">father's occupation</label>
            <input id="father's occupation" type="text" placeholder="Enter occupation">
        </div></li><br>
         <li><div>
            <label for="mother's occupation">Mother's Occupation</label>
            <input id="mother's occupation" type="text" placeholder="Enter occupation">
        </div></li><br>
<li><div>
            <label for="previous school name">Previous School Name</label>
            <input id="previous school name" type="text" placeholder="Enter school name">
        </div></li><br>
        <li><div>
            <label for="Previous Board">Previous Board</label>
            <input id="Previous Board" type="text" placeholder="Enter board name">
        </div></li><br>
        <li><div>
            <label for="Previous Class Marks">Previous Class Marks</label>
            <input id="Previous Class Marks" type="text" placeholder="Enter marks">
        </div></li><br>
        
<li><div>
            <label for="address">Address</label>
            <input id="address" type="text" placeholder="enter address">
        </div></li><br>
       
        
<button type="submit">submit</button>
