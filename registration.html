    <main>
        <ul>
         <form action="">
        <li><div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="enter name">
        </div></li><br>
        <li><div>
            <label for="email">Email</label>

            <input id="phone" type="phone" placeholder="enter phone">
        </div></li><br>
        <li><div>
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date">
        </div></li><br>
        <li><div>
            <label for="age">Age</label>
            <input id="age" type="number" placeholder="enter age">
        </div></li><br> <div class="form-group">
  <li><label class="form-label">Gender</label></li>
  <div class="radio-group">
    
    <label class="radio-label">
      <input type="radio" name="gender" value="male" required>
      <span class="custom-radio"></span> Male
    </label>

    <label class="radio-label">
      <input type="radio" name="gender" value="female">
      <span class="custom-radio"></span> Female
    </label>

    <label class="radio-label">
      <input type="radio" name="gender" value="other">
      <span class="custom-radio"></span> Other
    </label>

  </div>
</div><br>
        <li><div>
            <label for="address">Address</label>
            <input id="address" type="text" placeholder="enter address">

<button type="submit">submit</button>
